<!DOCTYPE html><html><head><meta charset="utf-8"><title>AI Competency & Placement System</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head><body>
<nav><div class="brand">AI <span class="accent">Competency</span> & Placement Predictor</div>
<div class="nav-links">{% if session.uid %}<a class="{% if request.endpoint == 'dashboard' %}active{% endif %}" href="{{ url_for('dashboard') }}">Dashboard</a>
{% if session.role=='admin' %}<a class="{% if request.endpoint == 'admin' %}active{% endif %}" href="{{ url_for('admin') }}">Admin</a>{% endif %}
<a href="{{ url_for('logout') }}">Logout ({{ session.name }})</a>{% endif %}</div></nav>
<div class="wrap">{% with m=get_flashed_messages(with_categories=true) %}{% for c,t in m %}<div class="flash {{c}}">{{t}}</div>{% endfor %}{% endwith %}
{% block content %}{% endblock %}</div></body></html>
