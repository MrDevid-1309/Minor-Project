{% extends "base.html" %}{% block content %}
<div class="card auth-card"><h2>Create your account</h2><p>Enter your details to get started.</p>
<form method="post">
<label>Full name</label><input name="name" required>
<label>Username</label><input name="username" required>
<label>Password</label><input type="password" name="password" required>
<div class="grid"><div><label>CGPA (4-10)</label><input type="number" step="0.01" min="4" max="10" name="cgpa" required></div>
<div><label>No. of projects</label><input type="number" min="0" max="10" name="projects" value="0" required></div>
<div><label>Internships</label><input type="number" min="0" max="5" name="internships" value="0" required></div>
<div><label>Communication (1-10)</label><input type="number" min="1" max="10" name="communication" value="5" required></div></div>
<button class="btn">Register</button> <a class="btn btn-secondary" href="{{ url_for('login') }}">Back to login</a></form></div>{% endblock %}
